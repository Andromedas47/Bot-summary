name: daily-stock-summary

# Daily Stock Core summary for P'Krai / Je — the morning purchasing report.
#
# Business requirement: 08:00 Asia/Bangkok every day, reporting the PREVIOUS
# business date (the day that just closed). The route resolves that date itself
# via previousBangkokBusinessDate, so this workflow passes no ?date=.
#
# Automatic scheduling is owned by Supabase Cron (08:00 Asia/Bangkok).
# This GitHub Actions workflow keeps workflow_dispatch only for
# manual / debug / emergency runs — it must NOT fire on a schedule.
#
# Bangkok is UTC+7 year-round with no DST. The Production route URL and
# Bearer CRON_SECRET auth match the Supabase Cron caller.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional business date override (YYYY-MM-DD). Leave blank for the previous business date."
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-stock-summary cron
        run: |
          URL="https://bot-summary.vercel.app/api/cron/daily-stock-summary"
          if [ -n "${{ inputs.date }}" ]; then
            URL="$URL?date=${{ inputs.date }}"
          fi
          curl -sf --max-time 60 \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$URL"
