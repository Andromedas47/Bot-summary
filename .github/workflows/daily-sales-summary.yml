name: daily-sales-summary

# P1 Daily Sales report — how much product was sold and what it is worth at the
# central selling price, for the PREVIOUS business date.
#
# Business requirement: 08:10 Asia/Bangkok every day (10 minutes after P0 Stock),
# reporting the PREVIOUS business date. The route resolves that date itself when
# no ?date= is supplied.
#
# Automatic scheduling is owned by Supabase Cron (08:10 Asia/Bangkok).
# This GitHub Actions workflow keeps workflow_dispatch only for
# manual / debug / emergency runs — it must NOT fire on a schedule.
#
# Delivery stays inert while SALES_SUMMARY_LINE_TARGETS is unset. Bangkok is
# UTC+7 year-round with no DST. The Production route URL and Bearer
# CRON_SECRET auth match the Supabase Cron caller.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional business date override (YYYY-MM-DD). Leave blank for the previous business date."
        required: false
        type: string
      debug:
        description: "Preview the messages without sending any LINE push."
        required: false
        type: boolean
        default: true
      revision:
        description: "Deliberate corrected resend only. Leave blank for the normal report — a value here mints new LINE retry keys, so the same day is delivered again. Reuse the SAME value to retry a correction without duplicating it."
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-sales-summary cron
        run: |
          URL="https://bot-summary.vercel.app/api/cron/daily-sales-summary"
          QUERY=""
          if [ -n "${{ inputs.date }}" ]; then
            QUERY="?date=${{ inputs.date }}"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            if [ -n "$QUERY" ]; then QUERY="$QUERY&debug=1"; else QUERY="?debug=1"; fi
          fi
          # No revision input == the normal report keys. A deliberate corrected
          # resend passes revision= to mint a new set of LINE retry keys.
          if [ -n "${{ inputs.revision }}" ]; then
            if [ -n "$QUERY" ]; then QUERY="$QUERY&revision=${{ inputs.revision }}"; else QUERY="?revision=${{ inputs.revision }}"; fi
          fi
          curl -sf --max-time 60 \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$URL$QUERY"
